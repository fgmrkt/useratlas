name: Build

# UserAtlas has two parts:
#  - app/       The actual app. The launcher fetches this folder from GitHub on
#               every start, so a change here reaches everyone right after a push.
#  - launcher/  UserAtlas.exe / UserAtlas.app itself, packed into the downloads.
#               New downloads are only needed when the launcher changes.
#
# When:
#  - every push and pull request: check the app and build Windows + macOS as a test
#  - a push to main where installer/VERSION has no release yet: publish that release
#    automatically (so a release is just: bump installer/VERSION and push)
#  - a tag like v1.2.0, or "Run workflow" with a version number: publish that release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for a new release, e.g. 1.1.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-app:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install requests
      - name: Check the code
        run: |
          python -m py_compile app/useratlas.py launcher/launcher.py
          python -c "import json; d = json.load(open('app/info.json')); print('App version', d['version'], '| min launcher', d['min_launcher'])"
          python app/useratlas.py --list

      - name: The embedded word list is in sync with app/blocklist.json
        run: |
          cp app/useratlas.py /tmp/before.py
          python tools/embed_blocklist.py
          diff -q /tmp/before.py app/useratlas.py || { echo "Run tools/embed_blocklist.py and commit the result"; exit 1; }

      - name: The blocked-word filter actually rejects slurs (and spares normal names)
        env:
          # base64 so the offensive test word isn't written in plain text; decoded only in memory
          SLUR_B64: bmlnZ2E=
          SLUR2_B64: ZmFnZ290
        run: |
          python - <<'PY'
          import base64, os, sys
          sys.path.insert(0, "app")
          import useratlas as ua
          assert ua.BLOCKLIST.terms, "blocklist did not load"
          P = {p.key: p for p in ua.all_platforms(["com"])}
          for b64 in (os.environ["SLUR_B64"], os.environ["SLUR2_B64"]):
              name = base64.b64decode(b64).decode()
              for key in ("minecraft", "roblox", "tiktok", "instagram", "twitch"):
                  assert P[key].problem(name), f"{key} did NOT flag a slur"
              # word sites reject it, but code sites / domains don't filter words
              assert P["github"].problem(name) is None
              assert P["domain.com"].problem(name) is None
          for ok_name in ("pixelfox", "felixvanzanten", "therapist", "grapefruit", "nightowl"):
              assert P["minecraft"].problem(ok_name) is None, f"false positive on {ok_name}"
          print("Blocked-word filter verified: slurs rejected on word-filtering sites, normal names pass.")
          PY

      - name: Decide whether to publish a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            v=$(tr -d ' \r\n' < installer/VERSION)
            if ! gh release view "v$v" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              tag="v$v"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release to publish: ${tag:-none}"

  windows:
    needs: check-app
    runs-on: windows-latest
    env:
      VERSION_TAG: ${{ needs.check-app.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install --upgrade pip requests pyinstaller

      - name: Build UserAtlas.exe (the launcher)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name UserAtlas
          --icon app/useratlas.ico
          launcher/launcher.py

      - name: Check that everything is inside the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UserAtlas.exe -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "UserAtlas.exe is missing parts (exit code $($p.ExitCode))" }
          Write-Host "Self-check passed"

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:VERSION_TAG) { $env:VERSION_TAG.TrimStart('v') } else { (Get-Content installer\VERSION).Trim() }
          & $env:ISCC "/DAppVersion=$version" installer\useratlas.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup reported an error" }
          Get-Item dist\UserAtlasSetup.exe | Format-List Name, Length

      - name: Test the installer (install, check, uninstall)
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath dist\UserAtlasSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installing failed (exit code $($setup.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\UserAtlas\UserAtlas.exe"
          if (-not (Test-Path $exe)) { throw "UserAtlas.exe was not installed" }
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installed app doesn't work" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\UserAtlas.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut is missing" }
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA "Programs\UserAtlas\unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          # The uninstaller continues from a temporary copy; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstalling left UserAtlas.exe behind" }
          Write-Host "Installing and uninstalling work"

      - name: Keep as download
        uses: actions/upload-artifact@v4
        with:
          name: UserAtlasSetup
          path: dist/UserAtlasSetup.exe

  macos:
    needs: check-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The python.org build is universal2, so the app runs on Apple Silicon and Intel Macs.
      - name: Install Python (python.org universal2 build)
        run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install packages
        run: |
          python3.12 -m pip install --upgrade pip pyinstaller
          # pure-Python build of charset-normalizer, so every part of the app is universal2
          python3.12 -m pip install requests --no-binary charset-normalizer
          python3.12 -c "import sysconfig; print('Python platform:', sysconfig.get_platform())"

      - name: Build the app icon
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s installer/useratlas.png --out "icon.iconset/icon_${s}x${s}.png"
            sips -z $((s*2)) $((s*2)) installer/useratlas.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o useratlas.icns

      - name: Build UserAtlas.app (the launcher)
        run: >
          python3.12 -m PyInstaller --noconfirm --clean --windowed
          --name UserAtlas
          --icon useratlas.icns
          --osx-bundle-identifier com.fgmrkt.useratlas
          --target-arch universal2
          launcher/launcher.py

      - name: Sign the app bundle (ad-hoc) and verify the signature
        run: |
          codesign --force --deep --sign - dist/UserAtlas.app
          codesign --verify --deep --strict --verbose=2 dist/UserAtlas.app
          echo "Architectures: $(lipo -archs dist/UserAtlas.app/Contents/MacOS/UserAtlas)"
          echo "::notice title=mac-arch::UserAtlas.app architectures: $(lipo -archs dist/UserAtlas.app/Contents/MacOS/UserAtlas)"

      - name: Check that everything is inside the app
        run: |
          ./dist/UserAtlas.app/Contents/MacOS/UserAtlas --selfcheck
          echo "Self-check passed"

      - name: Launch test (fetches app/ from this repository and opens the window)
        continue-on-error: true
        run: |
          DATA="$HOME/Library/Application Support/UserAtlas"
          ./dist/UserAtlas.app/Contents/MacOS/UserAtlas &
          PID=$!
          for i in $(seq 1 45); do
            [ -f "$DATA/app/current/useratlas.py" ] && break
            sleep 1
          done
          sleep 10
          if kill -0 $PID 2>/dev/null; then RUNNING=yes; else RUNNING=no; fi
          screencapture -x launch.png 2>/dev/null || true
          ls "$DATA/app/current" || true
          cat "$DATA/launcher.log" 2>/dev/null || true
          kill $PID 2>/dev/null || true
          if [ -f "$DATA/app/current/useratlas.py" ]; then
            echo "::notice title=mac-launch::macOS launcher fetched the app from GitHub; still running after 10s: $RUNNING"
          else
            echo "::warning title=mac-launch::macOS launcher did not fetch the app (still running: $RUNNING)"
            exit 1
          fi

      - name: Zip the app
        run: |
          ditto -c -k --keepParent dist/UserAtlas.app dist/UserAtlas-macOS.zip
          ls -lh dist/UserAtlas-macOS.zip

      - name: Test the Terminal installer (installs the latest release)
        run: |
          bash -n install-mac.sh
          USERATLAS_NO_OPEN=1 bash install-mac.sh
          APP=/Applications/UserAtlas.app
          [ -d "$APP" ] || APP="$HOME/Applications/UserAtlas.app"
          codesign --verify --deep --strict "$APP"
          if xattr -p com.apple.quarantine "$APP" 2>/dev/null; then echo "quarantine mark still set"; exit 1; fi
          "$APP/Contents/MacOS/UserAtlas" --selfcheck
          echo "::notice title=mac-install::Terminal installer works: $APP installed, signature valid, no quarantine mark"

      - name: Keep as download
        uses: actions/upload-artifact@v4
        with:
          name: UserAtlas-macOS
          path: dist/UserAtlas-macOS.zip

  release:
    needs: [check-app, windows, macos]
    if: needs.check-app.outputs.tag != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-app.outputs.tag }}
          name: UserAtlas ${{ needs.check-app.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/UserAtlasSetup.exe
            dist/UserAtlas-macOS.zip
          generate_release_notes: true
          body: |
            ## Windows
            Download **UserAtlasSetup.exe** below, double-click it and follow the steps. No Python needed.
            First time? Windows may show "Windows protected your PC" because the installer isn't
            digitally signed. Click *More info* → *Run anyway*.

            ## macOS (Apple Silicon and Intel)
            1. Download **UserAtlas-macOS.zip**, open it, and drag **UserAtlas.app** into your Applications folder.
            2. Open it once. macOS blocks it because the app isn't notarized by Apple. Click **Done** or **OK**.
            3. Go to **System Settings → Privacy & Security**, scroll down to *"UserAtlas" was blocked*,
               click **Open Anyway** and confirm. From then on it opens normally.

            You don't need to reinstall for new versions: the app fetches improvements from
            GitHub every time it starts.
